name: Supabase 깨워두기

# 무료 프로젝트는 일주일 동안 요청이 없으면 일시정지돼서, 사흘마다 가볍게 한 번 읽는다
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SUPABASE_URL }}/rest/v1/projects?select=slug&limit=1" -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}")
          echo "응답 $code"
          test "$code" = 200
