name: Supabase 동기화

# 올리기(push): 저장소의 sample.json·이미지가 바뀌면 Supabase에 반영하고 사이트를 다시 만든다
# 받기(pull): 관리자 페이지에서 고친 내용을 저장소로 가져온다 (저장소에서 작업하기 전에 먼저 실행)
on:
  push:
    branches: [main]
    paths:
      - scripts/sample.json
      - scripts/sample-img/**
  workflow_dispatch:
    inputs:
      direction:
        description: 'push = 저장소→Supabase, pull = Supabase→저장소'
        required: true
        default: pull
        type: choice
        options: [pull, push]

permissions:
  contents: write
  actions: write

concurrency:
  group: supabase-sync
  cancel-in-progress: false

jobs:
  push:
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[from-admin]')) || (github.event_name == 'workflow_dispatch' && inputs.direction == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-push.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # 올린 뒤 사이트를 Supabase 내용으로 다시 만든다
      - run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  pull:
    if: github.event_name == 'workflow_dispatch' && inputs.direction == 'pull'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-pull.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sample.json scripts/sample-img
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; else git commit -m "관리자 페이지 내용 가져오기 [from-admin]" && git push; fi
